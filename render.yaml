services:
  # ------------------------------------------------------------
  # Backend Web Service (Spring Boot Docker)
  # ------------------------------------------------------------
  - type: web
    name: ai-task-manager-backend
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/actuator/health
    envVars:
      - key: PORT
        value: 8080
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: OPENAI_API_KEY
        sync: false

  # ------------------------------------------------------------
  # Frontend Web Service (React Static Site)
  # ------------------------------------------------------------
  - type: web
    name: ai-task-manager-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://ai-task-manager-backend-8xr9.onrender.com/api
