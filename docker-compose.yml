version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: aitm-mvc-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-aitaskmanager}
      MYSQL_USER: ${MYSQL_USER:-aitaskuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-aitaskpassword}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost","-u","root","-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aitm-mvc-backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-aitaskmanager}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: ${MYSQL_USER:-aitaskuser}
      DB_PASSWORD: ${MYSQL_PASSWORD:-aitaskpassword}
      JWT_SECRET: ${JWT_SECRET:-myVerySecretKeyForProductionUse2024ChangeThis}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-your-openai-api-key}
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aitm-mvc-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  mysql_data:

networks:
  app-network:
    driver: bridge
