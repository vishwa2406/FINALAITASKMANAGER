# ============================================================
# APPLICATION CONFIGURATION
# ============================================================
server.port=${PORT:8081}
server.servlet.context-path=/api

# ============================================================
# DATABASE (Default: H2 in-memory DB with MySQL compatibility)
# Override via DB_URL, DB_USERNAME, DB_PASSWORD environment variables for MySQL
# ============================================================
spring.datasource.url=${DB_URL:jdbc:h2:mem:aitaskmanager;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# Enable H2 web console for development/debugging
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# ============================================================
# JPA / HIBERNATE
# ============================================================
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# JWT
# ============================================================
app.jwt.secret=${JWT_SECRET:mySecretKeyForAITaskManagerApplicationThatIsVeryLong2024}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# ============================================================
# OPENAI
# ============================================================
app.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com}
app.openai.api-key=${OPENAI_API_KEY:your-openai-api-key-here}
app.openai.model=${OPENAI_MODEL:gpt-3.5-turbo}
app.openai.max-tokens=${OPENAI_MAX_TOKENS:500}

# ============================================================
# CORS
# ============================================================
app.cors.allowed-origins=${CORS_ORIGINS:*,http://localhost:3000,http://localhost:5173}

# ============================================================
# LOGGING
# ============================================================
logging.level.com.aitaskmanager=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
